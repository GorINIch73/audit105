<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#123a4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f6f78;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2c14e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e07a5f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" ry="48" fill="url(#bgGradient)"/>

  <!-- Таблица оборотов (символ ведомости) -->
  <g transform="translate(40, 44)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="104" rx="10" fill="#ecf0f1"/>
    <rect x="0" y="0" width="120" height="22" rx="10" fill="#3498db"/>
    <rect x="10" y="32" width="100" height="6" rx="2" fill="#95a5a6"/>
    <rect x="10" y="46" width="72" height="6" rx="2" fill="#95a5a6"/>
    <rect x="10" y="60" width="88" height="6" rx="2" fill="#e07a5f"/>
    <rect x="10" y="74" width="60" height="6" rx="2" fill="#f2c14e"/>
    <rect x="10" y="88" width="96" height="6" rx="2" fill="#95a5a6"/>
  </g>

  <!-- Лупа аудита -->
  <g transform="translate(112, 108)" filter="url(#shadow)">
    <circle cx="40" cy="40" r="26" fill="none" stroke="url(#accentGradient)" stroke-width="8"/>
    <line x1="60" y1="60" x2="80" y2="80" stroke="url(#accentGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="128" y="228" font-family="Arial, sans-serif" font-size="30" font-weight="bold"
        fill="#ecf0f1" text-anchor="middle" opacity="0.95">105</text>
</svg>
